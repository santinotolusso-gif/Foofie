{% extends "base.html" %}

{% block titulo %}Crear cuenta — SaborIA{% endblock %}

{% block contenido %}
<div class="pagina-auth">
  <div class="tarjeta-simple">
    <h1 style="font-size:1.5rem; margin-bottom:1.5rem; text-align:center;">Crear una cuenta</h1>
    <form method="POST">
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required autocomplete="name">
      </div>
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="password2">Repetir contraseña</label>
        <input type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primario btn-bloque">Crear cuenta</button>
    </form>
    <p style="text-align:center; margin-top:1.25rem; font-size:.9rem; color:var(--warm-500);">
      ¿Ya tenés cuenta? <a href="{{ url_for('login') }}" style="color:var(--olive-600); font-weight:600;">Ingresá</a>
    </p>
  </div>
</div>
{% endblock %}
